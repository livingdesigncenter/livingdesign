퍼스와 예술대학을 거치며 약 20년 동안 가구·리빙디자인 연구와 교육, 산학협력을 이어 왔습니다. 앞으로 가구·공공·공간디자인의 융합 연구를 바탕으로 AI 등 미래 기술을 디자인 연구에 접목하고, 산업체와의 공동연구, 현장 실증, 인재양성을 넓혀 대학과 산업을 잇는 연구 플랫폼으로 성장해 나가겠습니다."},"en":{"title":"Opening Ceremony of the KNU Living Design Center","body":"The Living Design Center (LIV:D) at Kongju National University held its opening ceremony on October 1, 2026 at the Baekje Culture Education Center (Room 106). President Lim Kyung-ho, Center Director Kim Geon-soo, university staff, faculty and students attended, together with industry representatives including the Korea Federation of Furniture Industry Cooperatives and the Daejeon·Sejong·Chungnam Furniture Industry Cooperative. The program included an introduction to the center, congratulatory remarks, a signboard unveiling and a commemorative photo.\n\nStarting at the Chungnam Techno Park in 2007 and continuing through the Okryong Campus and the College of Arts, the center has carried out furniture and living design research, education and industry collaboration for about twenty years. Building on convergence research across furniture, public and spatial design, the center will bring AI and other emerging technologies into design research and expand joint research with industry, field validation and talent development."},"links":[["머니투데이","국립공주대 리빙디자인센터 개소…AI 융합 연구·산학협력 확대","https://www.mt.co.kr/policy/2026/10/06/2026100613315796737"],["베리타스알파","국립공주대 리빙디자인센터 개소… 미래 리빙디자인 연구/산학협력 거점 구축","https://www.veritas-a.com/news/articleView.html?idxno=630629"],["대학저널","국립공주대 리빙디자인센터 개소","https://www.dhnews.co.kr/news/view/1065577858081569"],["대학IN","국립공주대, 리빙디자인센터 개소…미래 디자인 연구·산학협력 거점 구축","http://www.dhinsight.co.kr/news/articleView.html?idxno=25888"],["일간투데이","국립공주대, 리빙디자인센터 개소…'미래 리빙디자인 연구·산학협력 거점 구축'","https://www.dtoday.co.kr/news/articleView.html?idxno=795449"],["충남일보","국립공주대 리빙디자인센터 개소","http://www.chungnamilbo.co.kr/news/articleView.html?idxno=913233"],["충남신문","국립공주대 리빙디자인센터 개소… 미래 리빙디자인 연구·산학협력 거점 구축","http://www.ccsimin.com/292   const t=site.text[lang],labels=site.sectionLabels[lang],c=site.contact;
  $('kor').classList.toggle('active',lang==='ko');$('eng').classList.toggle('active',lang==='en');
  $('brandLogo').src=site.logos.brand;$('knuLogo').src=site.logos.knu;
  const ids=['about','research','business','team','projects','contact'];
  const navItems=ids.map((id,j)=>[id,t.nav[j]]);navItems.splice(5,0,['news',t.newsNav||(lang==='ko'?'소식':'News')]);
  $('nav').innerHTML=navItems.map(([id,label])=>`<a href="#${id}">${safe(label)}</a>`).join('');
  $('heroTitle').innerHTML=safe(t.heroTitle).replace(/\n/g,'<br>');
  for(const id of ['heroText','aboutTitle','aboutText','researchTitle','businessTitle','teamTitle','teamLead','projectsTitle','projectsLead','archiveNote','newsTitle','newsLead','partnersTitle','directionsTitle','directionsNote','contactTitle','contactName','phoneTitle','footerName','footerUniversity'])$(id).textContent=t[id]||'';
  $('contactEmail').textContent=$('footEmail').textContent=c.email;
  $('contactPhone').textContent=$('footPhone').textContent=c.phone;
  $('contactAddress').textContent=$('footerAddress').textContent=c.address[lang];
  $('copyright').textContent=c.copyright;
  const v=site.video,fig=$('introFigure');
  if(v&&(v.url||v.file)){
    const vid=$('introVideo'),key=[v.url,v.file,v.poster.length].join('|');
    if(vid.dataset.key!==key){
      vid.dataset.key=key;vid.poster=v.poster||'';
      vid.innerHTML=[v.url,v.file].filter(Boolean).map(s=>`<source src="${safe(s)}" type="video/mp4">`).join('');
      vid.load();
    }
    $('introCaption').innerHTML=`<b>${safe(v.caption[lang])}</b>${v.duration?`<span>${safe(v.duration)}</span>`:''}`;
    vid.setAttribute('aria-label',v.caption[lang]);
    fig.hidden=false;
  }else fig.hidden=true;
  $('researchCards').innerHTML=t.research.map((r,i)=>`<button class="card area-link" type="button" data-coming="research"><div class="num">RESEARCH ${String(i+1).padStart(2,'0')}</div><h3>${safe(r[0])}</h3><p>${safe(r[1])}</p></button>`).join('');
  $('businessCards').innerHTML=t.business.map((r,i)=>`<button class="service area-link" type="button" data-coming="business"><div class="num">${String(i+1).padStart(2,'0')}</div><b>${safe(r[0])}</b><p>${safe(r[1])}</p></button>`).join('');
  $('projectCards').innerHTML=t.projects.map((r,i)=>`<article class="project-tile"><div class="num">${String(i+1).padStart(2,'0')} / ARCHIVE</div><h3>${safe(r[0])}</h3><div>${safe(r[1])}</div></article>`).join('');
  $('partnerList').innerHTML=(site.partners||[]).map(pt=>{const info=pt[lang]||pt.ko;return `<li><b>${safe(info.name)}</b>${info.desc?`<span>${safe(info.desc)}</span>`:''}</li>`}).join('');
  $('partnerList').parentElement.hidden=!(site.partners||[]).length;
  const mq=c.mapQuery||c.address.ko,mqe=encodeURIComponent(mq),mf=$('mapFrame');
  if(mf.dataset.q!==mq){mf.dataset.q=mq;mf.innerHTML=`<iframe src="https://maps.google.com/maps?q=${mqe}&z=16&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="${safe(mq)}"></iframe>`}
  $('mapLinks').innerHTML=[['네이버 지도','Naver Map',`https://map.naver.com/p/search/${mqe}`],['카카오맵','Kakao Map',`https://map.kakao.com/?q=${mqe}`],['구글 지도','Google Maps',`https://www.google.com/maps/search/?api=1&query=${mqe}`]].map(([k,e,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${lang==='ko'?k:e}</a>`).join('');
  $('newsList').innerHTML=(site.news||[]).map(n=>{
    const info=n[lang]||n.ko,links=(n.links||[]).filter(l=>/^https?:\/\//i.test(l[2]||''));
    return `<article class="news-post"><time class="news-date" datetime="${safe(n.date)}">${safe((n.date||'').replace(/-/g,'.'))}</time><h3>${safe(info.title)}</h3>${(n.photos||[]).length?`<div class="news-photos">${n.photos.map(ph=>`<figure><img src="${safe(ph.src)}" alt="${safe(ph[lang]||ph.ko||'')}" loading="lazy"><figcaption>${safe(ph[lang]||ph.ko||'')}</figcaption></figure>`).join('')}</div>`:''}<div class="news-body">${String(info.body||'').split(/\n\s*\n/).filter(x=>x.trim()).map(x=>`<p>${safe(x.trim()).replace(/\n/g,'<br>')}</p>`).join('')}</div>${links.length?`<div class="news-links"><h4>${lang==='ko'?'관련 보도':'Press Coverage'}</h4><ul>${links.map(l=>`<li><a href="${safe(l[2])}" target="_blank" rel="noopener noreferrer"><span class="src">${safe(l[0])}</span><span>${safe(l[1])}</span></a></li>`).join('')}</ul></div>`:''}</article>`;
  }).join('');
  $('profiles').innerHTML=site.people.map(p=>{
    const info=p[lang],open=openCV.has(p.id);
    const sections=(p.cv[lang]||[]).filter(s=>s.rows.length).map(s=>`<section class="cv-section"><h4>${safe(labels[s.key]||s.key)}</h4><div class="cv-list">${s.rows.map(r=>`<div class="cvrow"><time>${safe(r[0])}</time><span>${safe(r[1])}</span></div>`).join('')}</div></section>`).join('');
    const btn=lang==='ko'?(open?'이력 닫기 −':'이력 보기 ＋'):(open?'Close CV −':'View CV ＋');
    return `<article class="profile"><div class="profile-main"><img class="portrait" alt="${safe(info.name)}" src="${safe(p.photo)}"><div><div class="overline">${safe(p.label)}</div><div class="name-line"><h3>${safe(info.name)}</h3>${sections?`<button class="cv-toggle" type="button" data-person="${safe(p.id)}" aria-expanded="${open}">${btn}</button>`:''}</div><div class="role">${safe(info.role)}</div><div class="tag">${safe(info.area)}</div>${p.email?`<a class="email" href="mailto:${safe(p.email)}">${safe(p.email)}</a>`:''}</div></div><div class="cv" id="cv-${safe(p.id)}"${open?'':' hidden'}>${sections}</div></article>`;
  }).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.cv-toggle');if(!b)return;
  const id=b.dataset.person;if(openCV.has(id))openCV.delete(id);else openCV.add(id);
  const isOpen=openCV.has(id);$('cv-'+id).hidden=!isOpen;b.setAttribute('aria-expanded',String(isOpen));
  b.textContent=current==='ko'?(isOpen?'이력 닫기 −':'이력 보기 ＋'):(isOpen?'Close CV −':'View CV ＋');
});
$('kor').onclick=()=>render('ko');$('eng').onclick=()=>render('en');

let previousFocus=null;
function closeComing(){$('comingOverlay').hidden=true;document.body.style.overflow='';if(previousFocus)previousFocus.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-coming]');if(!b)return;previousFocus=b;$('comingType').textContent=b.querySelector('h3,b')?.textContent||'LIV:D';$('comingTitle').textContent=current==='ko'?'준비중입니다':'Coming Soon';$('comingSubtitle').textContent=current==='ko'?'콘텐츠를 준비하고 있습니다.':'This page is currently being prepared.';$('comingBack').textContent=current==='ko'?'돌아가기':'Go Back';$('comingOverlay').hidden=false;document.body.style.overflow='hidden';$('closeComing').focus()});
$('closeComing').onclick=closeComing;$('comingBack').onclick=closeComing;
$('comingOverlay').addEventListener('click',e=>{if(e.target===$('comingOverlay'))closeComing()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('comingOverlay').hidden)closeComing()});
render('ko');

/* ---------------- 문서 생성 (게시·내보내기 공용) ---------------- */
function buildDoc(data){
  const headStyle=document.head&&document.head.querySelector('style');
  const reset=headStyle?headStyle.textContent:FALLBACK_RESET;
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+TITLE+'</title>'+HEAD_META+'<style>'+reset+'</style></head><body>'
    +'<style id="site-style">'+$('site-style').textContent+'</style>'
    +'<style id="editor-style">'+$('editor-style').textContent+'</style>'
    +'<template id="shell">'+$('shell').innerHTML+'</template>'
    +'<div id="root"></div>'
    +'<script type="application/json" id="site-data">'+json+'<\/script>'
    +'<script id="app">'+$('app').textContent+'<\/script></body></html>';
}

let ART=null,DL=null,dirty=false,tab='text',pendingDraft=null,draftTimer=null;
const openGroups=new Set(['g-hero']);
const confirmArm={};

function toast(msg){const t=$('edToast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},4200)}
function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function lsGet(){try{const v=localStorage.getItem(DRAFT_KEY);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(v))}catch(e){}}
function lsDel(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}

function setStatus(){
  const s=$('edStatus');
  s.className='ed-status'+(dirty?' dirty':'');
  s.textContent=dirty?'저장하지 않은 변경 있음':'마지막 게시 '+(SAVED.updated||'');
  $('edSave').disabled=!dirty;$('edRevert').disabled=!dirty;
  $('fabDot').hidden=!dirty;
}
function markDirty(){
  dirty=strip(site)!==strip(SAVED);setStatus();render(current);
  clearTimeout(draftTimer);draftTimer=setTimeout(()=>{if(dirty)lsSet(site);else lsDel()},500);
}
function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,path,v){const ks=path.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
const fid=path=>'f-'+path.replace(/[^a-zA-Z0-9]/g,'-');

function input(path,opt={}){
  const v=getPath(site,path)??'';
  return opt.multi?`<textarea id="${fid(path)}" data-path="${path}" rows="${opt.rows||2}">${safe(v)}</textarea>`
    :`<input id="${fid(path)}" type="${opt.type||'text'}" data-path="${path}" value="${safe(v)}">`;
}
function pair(label,base,opt){
  return `<div class="ed-field"><span class="ed-lbl">${label}</span><div class="ed-pair"><span class="lang">KOR</span>${input(base.replace('{L}','ko'),opt)}<span class="lang">ENG</span>${input(base.replace('{L}','en'),opt)}</div></div>`;
}
function single(label,path,opt){return `<div class="ed-field"><label for="${fid(path)}">${label}</label>${input(path,opt)}</div>`}
function group(key,title,inner){return `<details class="ed-group" data-key="${key}"${openGroups.has(key)?' open':''}><summary>${title}</summary><div class="ed-inner">${inner}</div></details>`}
function cards(listKey,word){
  return site.text.ko[listKey].map((_,i)=>pair(`${word} ${i+1} · 제목`,`text.{L}.${listKey}.${i}.0`)+pair(`${word} ${i+1} · 설명`,`text.{L}.${listKey}.${i}.1`,{multi:true})).join('');
}

const cvToText=rows=>rows.map(r=>r[0]?`${r[0]} | ${r[1]}`:r[1]).join('\n');
const textToCv=txt=>txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const k=l.indexOf('|');if(k>-1&&k<=24)return [l.slice(0,k).trim(),l.slice(k+1).trim()];return ['',l]});

function cvBlock(i,L){
  const p=site.people[i],labels=site.sectionLabels[L];
  const secs=(p.cv[L]||[]).map((s,j)=>`<div class="ed-sec"><div class="ed-row"><select id="sk-${p.id}-${L}-${j}" data-seckey="${i}|${L}|${j}" aria-label="항목 종류">${Object.keys(labels).map(k=>`<option value="${k}"${k===s.key?' selected':''}>${safe(labels[k])}</option>`).join('')}</select><button class="ed-btn small" type="button" data-act="secup" data-i="${i}" data-l="${L}" data-j="${j}" aria-label="위로">↑</button><button class="ed-btn small" type="button" data-act="secdown" data-i="${i}" data-l="${L}" data-j="${j}" aria-label="아래로">↓</button><button class="ed-btn small danger" type="button" data-act="secdel" data-i="${i}" data-l="${L}" data-j="${j}">${confirmArm['secdel'+p.id+L+j]?'한 번 더 누르면 삭제':'삭제'}</button></div><textarea class="cv" id="cv-${p.id}-${L}-${j}" data-cv="${i}|${L}|${j}" rows="${Math.min(14,Math.max(4,s.rows.length+1))}" spellcheck="false">${safe(cvToText(s.rows))}</textarea></div>`).join('');
  return secs+`<div class="ed-row"><button class="ed-btn small" type="button" data-act="secadd" data-i="${i}" data-l="${L}">＋ 이력 항목 추가</button>${L==='en'?`<button class="ed-btn small" type="button" data-act="copycv" data-i="${i}">${confirmArm['copycv'+p.id]?'영문 이력을 덮어씁니다. 한 번 더 누르세요':'국문 이력을 영문에 복사'}</button>`:''}</div>`;
}

function publishTab(){
  return (pendingDraft?`<div class="ed-note" style="border:1px solid #e6c08f"><h4>저장하지 않은 편집 내용이 남아 있습니다</h4><p>이 브라우저에서 게시하지 않고 닫은 편집 내용입니다.</p><div class="ed-row"><button class="ed-btn small primary" type="button" data-act="draftload">편집 내용 불러오기</button><button class="ed-btn small" type="button" data-act="draftdrop">버리기</button></div></div>`:'')
  +`<div class="ed-note"><h4>1. 이 페이지에 게시</h4><p><b>저장하고 게시</b>를 누르면 이 페이지가 새 버전으로 저장되고, 링크를 가진 모든 사람이 바로 새 내용을 봅니다. 편집 권한이 있는 사람만 이 패널이 보입니다.</p><p>마지막 게시: <b>${safe(SAVED.updated||'-')}</b></p></div>`
  +`<div class="ed-note"><h4>2. 공식 홈페이지(livingdesign.or.kr)에 올리기</h4><ol><li>아래 <b>index.html 내려받기</b>를 누릅니다. 지금 화면에 보이는 내용 그대로 저장됩니다.</li><li>서버의 기존 <code>index.html</code>을 이 파일로 바꿉니다. <code>assets</code> 폴더(메인 영상)는 그대로 둡니다.</li>${site.video?`<li>센터 소개 영상은 처음 한 번만 <code>${safe(site.video.file)}</code> 이름으로 서버에 올려 두면 됩니다.</li>`:''}</ol><p>사진·로고·이력은 index.html 안에 모두 들어 있습니다. 공식 홈페이지에서는 편집 패널이 나타나지 않습니다.</p><div class="ed-row"><button class="ed-btn primary small" type="button" data-act="export"${DL?'':' disabled'}>index.html 내려받기</button></div>${DL?'':'<p class="ed-help">이 화면에서는 파일 내려받기를 쓸 수 없습니다.</p>'}</div>`
  +`<div class="ed-note"><h4>3. 백업</h4><p>내용 전체를 파일 하나로 보관하거나, 보관한 파일로 되돌립니다. 불러온 내용은 게시 전까지 반영되지 않습니다.</p><div class="ed-row"><button class="ed-btn small" type="button" data-act="backup"${DL?'':' disabled'}>백업 파일 내려받기</button><span class="ed-btn small ed-file">백업 불러오기<input type="file" accept=".json,application/json" id="importJson" aria-label="백업 불러오기"></span></div></div>`;
}
function renderEditor(){
  const body=$('edBody'),top=body.scrollTop;
  document.querySelectorAll('.ed-tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  body.innerHTML=tab==='text'?textTab():tab==='people'?peopleTab():publishTab();
  body.scrollTop=top;setStatus();
}
function rerender(){renderEditor();markDirty()}

function readPhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const max=640,sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.86))};img.src=r.result};r.readAsDataURL(file)})}

function wireEditor(){
  const body=$('edBody');
  body.addEventListener('toggle',e=>{const d=e.target;if(!d.dataset||!d.dataset.key)return;if(d.open)openGroups.add(d.dataset.key);else openGroups.delete(d.dataset.key)},true);
  body.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.path){setPath(site,t.dataset.path,t.value);markDirty();return}
    if(t.dataset.newslinks){site.news[+t.dataset.newslinks].links=t.value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(l=>l.some(Boolean)).map(l=>l.length>3?[l[0],l.slice(1,-1).join(' | '),l[l.length-1]]:[l[0]||'',l[1]||'',l[2]||'']);markDirty();return}
    if(t.dataset.cv){const [i,L,j]=t.dataset.cv.split('|');site.people[+i].cv[L][+j].rows=textToCv(t.value);markDirty();return}
  });
  body.addEventListener('change',async e=>{
    const t=e.target;
    if(t.dataset.seckey){const [i,L,j]=t.dataset.seckey.split('|');site.people[+i].cv[L][+j].key=t.value;markDirty();return}
    if(t.dataset.photo&&t.files&&t.files[0]){try{site.people[+t.dataset.photo].photo=await readPhoto(t.files[0]);rerender();toast('사진을 바꿨습니다. 게시해야 반영됩니다.')}catch(err){toast('이 사진 파일을 읽지 못했습니다. JPG나 PNG 파일을 골라 주세요.')}return}
    if(t.id==='importJson'&&t.files&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());if(!d.text||!d.people||!d.contact)throw 0;site=d;rerender();toast('백업을 불러왔습니다. 확인 후 게시하세요.')}catch(err){toast('LIV:D 백업 파일이 아닙니다. 백업 파일 내려받기로 만든 .json 파일을 골라 주세요.')}t.value=''}
  });
  body.addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act,i=+b.dataset.i,L=b.dataset.l,j=+b.dataset.j,P=site.people[i];
    const arm=k=>{if(confirmArm[k]){delete confirmArm[k];return true}confirmArm[k]=1;renderEditor();setTimeout(()=>{if(confirmArm[k]){delete confirmArm[k];renderEditor()}},4000);return false};
    const swap=(arr,x,y)=>{if(y<0||y>=arr.length)return false;[arr[x],arr[y]]=[arr[y],arr[x]];return true};
    if(a==='secadd'){P.cv[L].push({key:'publications',rows:[]});rerender()}
    else if(a==='secup'){if(swap(P.cv[L],j,j-1))rerender()}
    else if(a==='secdown'){if(swap(P.cv[L],j,j+1))rerender()}
    else if(a==='secdel'){if(arm('secdel'+P.id+L+j)){P.cv[L].splice(j,1);rerender()}}
    else if(a==='copycv'){if(arm('copycv'+P.id)){P.cv.en=clone(P.cv.ko);rerender();toast('국문 이력을 영문 칸에 복사했습니다.')}}
    else if(a==='pup'){if(swap(site.people,i,i-1))rerender()}
    else if(a==='pdown'){if(swap(site.people,i,i+1))rerender()}
    else if(a==='pdel'){if(arm('pdel'+P.id)){site.people.splice(i,1);rerender()}}
    else if(a==='padd'){const id='p'+Date.now().toString(36);const n=site.people.length+1;site.people.push({id,photo:site.people[site.people.length-1]?.photo||'',email:'',label:String(n).padStart(2,'0')+' / RESEARCHER',ko:{name:'새 연구진',role:'',area:''},en:{name:'New Researcher',role:'',area:''},cv:{ko:[{key:'education',rows:[]},{key:'career',rows:[]}],en:[{key:'education',rows:[]},{key:'career',rows:[]}]}});openGroups.add('p-'+id);rerender();const body=$('edBody');body.scrollTop=body.scrollHeight}
    else if(a==='ptadd'){site.partners=site.partners||[];site.partners.push({id:'pt'+Date.now().toString(36),ko:{name:'새 협력기관',desc:''},en:{name:'New partner',desc:''}});openGroups.add('g-partners');rerender()}
    else if(a==='ptup'){if(swap(site.partners,i,i-1))rerender()}
    else if(a==='ptdown'){if(swap(site.partners,i,i+1))rerender()}
    else if(a==='ptdel'){if(arm('ptdel'+site.partners[i].id)){site.partners.splice(i,1);rerender()}}
    else if(a==='nadd'){site.news=site.news||[];site.news.unshift({id:'n'+Date.now().toString(36),date:today(),ko:{title:'새 소식',body:''},en:{title:'New post',body:''},links:[]});openGroups.add('g-news');rerender()}
    else if(a==='nup'){if(swap(site.news,i,i-1))rerender()}
    else if(a==='ndown'){if(swap(site.news,i,i+1))rerender()}
    else if(a==='ndel'){if(arm('ndel'+site.news[i].id)){site.news.splice(i,1);rerender()}}
    else if(a==='draftload'){site=pendingDraft;pendingDraft=null;rerender();toast('저장하지 않았던 편집 내용을 불러왔습니다.')}
    else if(a==='draftdrop'){pendingDraft=null;lsDel();renderEditor()}
    else if(a==='export'){if(!DL)return;try{await DL.save({filename:'index.html',data:new Blob([buildDoc(forServer(site))],{type:'text/html'})})}catch(err){if(err&&err.code&&err.code!=='declined'&&err.code!=='cancelled')toast('파일을 내려받지 못했습니다.')}}
    else if(a==='backup'){if(!DL)return;try{await DL.save({filename:'livd-backup-'+today()+'.json',data:new Blob([JSON.stringify(site)],{type:'application/json'})})}catch(err){}}
  });
  document.querySelectorAll('.ed-tabs [data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('edBody').scrollTop=0;renderEditor()});
  $('editFab').onclick=()=>{$('editor').hidden=false;$('editFab').hidden=true;document.body.classList.add('ed-open');renderEditor()};
  $('edClose').onclick=()=>{$('editor').hidden=true;$('editFab').hidden=false;document.body.classList.remove('ed-open')};
  $('edRevert').onclick=()=>{site=clone(SAVED);dirty=false;lsDel();renderEditor();render(current);toast('게시된 내용으로 되돌렸습니다.')};
  $('edSave').onclick=save;
}
function readOnly(msg){$('editor').hidden=true;$('editFab').hidden=true;document.body.classList.remove('ed-open');toast(msg)}
async function save(){
  if(!ART||!dirty)return;
  const btn=$('edSave');btn.disabled=true;btn.textContent='게시 중…';
  site.updated=today();lsSet(site);
  try{
    await ART.publish(buildDoc(site));
    const s=$('edStatus');s.className='ed-status ok';s.textContent='게시했습니다. 새 버전을 불러오는 중…';
  }catch(err){
    const code=err&&err.code;btn.textContent='저장하고 게시';btn.disabled=false;
    if(code==='conflict')toast('다른 사람이 먼저 게시해서 최신 버전을 다시 불러옵니다. 편집 내용은 게시 탭에서 되살릴 수 있습니다.');
    else if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='consent_required'||code==='capability_disabled'||code==='capability_removed')readOnly('이 화면은 읽기 전용입니다. 편집 권한이 있는 계정으로 열어 주세요.');
    else if(code==='too_large')toast('페이지 용량이 너무 큽니다. 큰 사진을 줄이거나 빼고 다시 게시해 주세요.');
    else if(code==='rate_limited')toast('게시를 너무 자주 했습니다. 1분쯤 뒤에 다시 눌러 주세요.');
    else toast('게시하지 못했습니다. 잠시 뒤 다시 눌러 주세요.');
  }
}
async function initEditor(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{
    const [art,user,dl]=await Promise.all([claude.use('artifact'),claude.use('user'),claude.use('downloads')]);
    let can=false;try{can=user?await user.canEdit():false}catch(e){}
    if(!art||!can)return;
    ART=art;DL=dl;
    const d=lsGet();
    if(d&&d.text&&d.people){if(strip(d)===strip(SAVED))lsDel();else{pendingDraft=d;$('fabDot').hidden=false}}
    wireEditor();
    $('editFab').hidden=false;
    if(pendingDraft)tab='publish';
  }catch(e){}
}
initEditor();
})();
</script>
</body></html>
